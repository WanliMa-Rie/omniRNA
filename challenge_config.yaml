# If you are not sure what all these fields mean, please refer our documentation here:
# https://evalai.readthedocs.io/en/latest/configuration.html
title: OmniRNA Challenge
short_description: "OmniRNA: A Discovery Challenge for RNA Foundation Models"
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
category: [Dataset, Workshop]
leaderboard_description: Public development leaderboard and hidden final leaderboard for RNA fitness, structure, and evolutionary reasoning.
evaluation_script: evaluation_script.zip
remote_evaluation: False
start_date: 2026-04-01 00:00:00
end_date: 2026-06-01 23:59:59
published: True
tags:
  - rna
  - foundation-models
  - variant-effect-prediction
  - structure-prediction

leaderboard:
  - id: 1
    schema:
      labels:
        - Fitness Spearman
        - Fitness R2
        - Structure TM-score
        - Structure RMSD
        - Structure F1
        - Evolution Accuracy
        - Evolution Macro-F1
        - Overall
      default_order_by: Overall
      metadata:
        Fitness Spearman:
          sort_ascending: False
          description: Mean Spearman correlation across all fitness datasets and evaluation splits.
        Fitness R2:
          sort_ascending: False
          description: Secondary diagnostic metric for RNA fitness prediction.
        Structure TM-score:
          sort_ascending: False
          description: Mean TM-score across evaluation molecules for tertiary structure prediction.
        Structure RMSD:
          sort_ascending: True
          description: Secondary diagnostic metric for tertiary structure prediction.
        Structure F1:
          sort_ascending: False
          description: F1 score for RNA secondary-structure base-pair prediction.
        Evolution Accuracy:
          sort_ascending: False
          description: Accuracy for quartet phylogeny classification.
        Evolution Macro-F1:
          sort_ascending: False
          description: Macro-F1 for covariation detection.
        Overall:
          sort_ascending: False
          description: Arithmetic mean of mapped fitness score, structure TM-score, and evolution score.

challenge_phases:
  - id: 1
    name: Public Dev Phase
    description: templates/challenge_phase_1_description.html
    leaderboard_public: True
    is_public: True
    challenge: 1
    is_active: True
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2026-04-01 00:00:00
    end_date: 2026-06-01 23:59:59
    test_annotation_file: annotations/test_annotations_devsplit.json
    codename: dev
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".csv"

  - id: 2
    name: Final Hidden Phase
    description: templates/challenge_phase_2_description.html
    leaderboard_public: False
    is_public: True
    challenge: 2
    is_active: True
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: False
    start_date: 2026-04-01 00:00:00
    end_date: 2026-06-15 23:59:59
    test_annotation_file: annotations/test_annotations_testsplit.json
    codename: test
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".zip"

dataset_splits:
  - id: 1
    name: Development Test Split
    codename: train_split
  - id: 2
    name: Hidden Final Test Split
    codename: test_split

challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 1
    leaderboard_decimal_precision: 4
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: True
  - challenge_phase_id: 2
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 3
    leaderboard_decimal_precision: 4
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: False
  - challenge_phase_id: 2
    leaderboard_id: 1
    dataset_split_id: 2
    visibility: 3
    leaderboard_decimal_precision: 4
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: False
